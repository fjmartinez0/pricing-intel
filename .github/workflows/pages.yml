name: Validate and publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            python3 scripts/validate.py --base-ref HEAD~1
          else
            python3 scripts/validate.py
          fi
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/opportunities.json data/strategy.json data/people.json data/meta.json _site/data/
      - name: Stamp the time the data last changed
        run: |
          python3 - <<'PY'
          import json, subprocess
          path = "_site/data/meta.json"
          meta = json.load(open(path))
          meta["last_updated_at"] = subprocess.check_output(
              ["git", "log", "-1", "--format=%cI", "--", "data"], text=True).strip()
          json.dump(meta, open(path, "w"), indent=2)
          print("last_updated_at =", meta["last_updated_at"])
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
